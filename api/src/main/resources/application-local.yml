# MCP Server - enables AI agents to interact with Kafka via Model Context Protocol
mcp:
  enabled: true

logging:
  level:
    root: INFO
    io.kafbat.ui: DEBUG
    #org.springframework.http.codec.json.Jackson2JsonEncoder: DEBUG
    #org.springframework.http.codec.json.Jackson2JsonDecoder: DEBUG
    reactor.netty.http.server.AccessLog: INFO
    org.springframework.security: DEBUG
    # Suppress JMX SSL error (not needed for local dev with plain JMX)
    io.kafbat.ui.service.metrics.sink.jmx.JmxSslSocketFactory: OFF
    # Suppress macOS DNS resolver warning
    io.netty.resolver.dns.DnsServerAddressStreamProviders: WARN

#server:
#  port: 8080 #- Port on which the app will run.

spring:
  jmx:
    enabled: true
  ldap:
    urls: ldap://localhost:10389
    base: "cn={0},ou=people,dc=planetexpress,dc=com"
    admin-user: "cn=admin,dc=planetexpress,dc=com"
    admin-password: "GoodNewsEveryone"
    user-filter-search-base: "dc=planetexpress,dc=com"
    user-filter-search-filter: "(&(uid={0})(objectClass=inetOrgPerson))"
    group-filter-search-base: "ou=people,dc=planetexpress,dc=com"

kafka:
  # Global validation settings for cluster connection validation (used by UI "test connection").
  # These are the defaults; override per-cluster if needed.
  # validation:
  #   retries: 3                    # Number of AdminClient retries during validation
  #   requestTimeoutMs: 30000       # request.timeout.ms for validation AdminClient
  #   defaultApiTimeoutMs: 30000    # default.api.timeout.ms for validation AdminClient

  clusters:
    - name: local
      bootstrapServers: localhost:9092
      schemaRegistry: http://localhost:8085
      # Uncomment if running ksqlDB locally
      #ksqldbServer: http://localhost:8088
      # Uncomment if running Kafka Connect locally
      #kafkaConnect:
      #  - name: first
      #    address: http://localhost:8083
      metrics:
        port: 9997
        type: JMX

    # - name: confluent-cloud
    #   bootstrapServers: xxx:xxxx
    #   properties:
    #     security.protocol: SASL_SSL
    #     sasl.mechanism: PLAIN
    #     sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username='xxxx' password='xxxx';
    #   # Per-cluster validation override for slower cloud connections:
    #   validation:
    #     retries: 5
    #     requestTimeoutMs: 60000
    #     defaultApiTimeoutMs: 60000

# Dynamic config allows adding/editing clusters via UI without restarting
# Default path /etc/kafkaui is not writable in local dev, so use home directory
dynamic.config.enabled: true
dynamic.config.path: ${user.home}/.kafkaui/dynamic_config.yaml

oauth2:
  ldap:
    activeDirectory: false
    activeDirectory.domain: domain.com

auth:
  type: DISABLED
  #  type: OAUTH2
  #  type: LDAP
  oauth2:
    client:
      cognito:
        clientId: # CLIENT ID
        clientSecret: # CLIENT SECRET
        scope: openid
        client-name: cognito
        provider: cognito
        redirect-uri: http://localhost:8080/login/oauth2/code/cognito
        authorization-grant-type: authorization_code
        issuer-uri: https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_M7cIUn1nj
        jwk-set-uri: https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_M7cIUn1nj/.well-known/jwks.json
        user-name-attribute: cognito:username
        custom-params:
          type: cognito
          logoutUrl: https://kek.net/logout
      google:
        provider: google
        clientId: # CLIENT ID
        clientSecret: # CLIENT SECRET
        user-name-attribute: email
        custom-params:
          type: google
          allowedDomain: kafbat.dev
      github:
        provider: github
        clientId: # CLIENT ID
        clientSecret: # CLIENT SECRET
        scope:
          - read:org
        user-name-attribute: login
        custom-params:
          type: github

